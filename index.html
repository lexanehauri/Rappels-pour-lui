```html
<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mes rappels ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f3ef;
      color: #314f3d;

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;

      padding: 20px;
    }

    .loginBox {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
    }

    .loginBox h1 {
      margin-top: 0;
    }

    .loginBox input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 15px;
    }

    .loginButton {
      width: 100%;
      margin-top: 10px;
      background: #314f3d;

    #loginError {
      display: none;
      margin-top: 15px;
      color: #b3261e;
    }

    #app {
      display: none;
      max-width: 800px;
      margin: auto;
      padding: 25px 20px 50px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;

    .header h1 {
      margin: 0;

    .logout {
      background: #e8e3dc;

      background: white;

      border-radius: 18px;
      margin-bottom: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    }

    .addBox input,
    .addBox select {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    .addButton {
      width: 100%;
      margin-top: 8px;
      background: #314f3d;

    .reminder {
      background: white;
      padding: 17px;
      border-radius: 15px;

      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
    }

      opacity: 0.55;
    }

    .reminderContent {
      flex: 1;
    }

    .reminderTitle {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .reminderInfo {
      font-size: 13px;
      color: #777;
    }

    .deleteButton {
      background: #f1dddd;
      color: #8b2e2e;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 30px;
    }
  </style>
</head>

<body>

  <!-- CONNEXION -->

  <div id="loginScreen">

    <div class="loginBox">

      <h1>Mes rappels ❤️</h1>

      <p>Connecte-toi pour accéder à tes rappels.</p>

      <input
        id="loginEmail"
        type="email"
        placeholder="Adresse e-mail"
        autocomplete="email"
      >

      <input
        id="loginPassword"
        type="password"
        placeholder="Mot de passe"
        autocomplete="current-password"
      >

      <button
        class="loginButton"
        id="loginButton"
      >
        Se connecter
      </button>

      <div id="loginError"></div>

    </div>

  </div>


  <!-- APPLICATION -->

  <main id="app">

    <div class="header">

      <h1>Mes rappels ❤️</h1>

      <button
        class="logout"
        id="logoutButton"
      >
        Se déconnecter
      </button>

    </div>


    <!-- AJOUT RAPPEL -->

    <section class="addBox">

      <h2>Ajouter un rappel</h2>

      <input
        id="reminderTitle"
        type="text"
        placeholder="Ex : Acheter du lait"
      >

      <input
        id="reminderDate"
        type="datetime-local"
      >

      <select id="reminderFor">

        <option value="me">
          Pour moi
        </option>

        <option value="partner">
          Pour mon/ma partenaire
        </option>

      </select>

      <button
        class="addButton"
        id="addReminderButton"
      >
        Ajouter le rappel
      </button>

    </section>


    <!-- LISTE -->

    <section>

      <h2>Rappels</h2>

      <div id="remindersList"></div>

    </section>

  </main>


  <!-- FIREBASE -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      deleteDoc,
      updateDoc,
      doc,
      query,
      orderBy,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    /* =========================
       FIREBASE
    ========================= */

    const firebaseConfig = {

      apiKey:
        "AIzaSyCVRjsFQUcbioyCcaWcQ_fG3QLa2ZwEQj4",

      authDomain:
        "rappels-pour-lui.firebaseapp.com",

      projectId:
        "rappels-pour-lui",

      storageBucket:
        "rappels-pour-lui.firebasestorage.app",

      messagingSenderId:
        "232679000779",

      appId:
        "1:232679000779:web:d97745ece1e16e4f9c294e"

    };


    const firebaseApp =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(firebaseApp);

    const db =
      getFirestore(firebaseApp);


    /* =========================
       ELEMENTS
    ========================= */

    const loginScreen =
      document.getElementById("loginScreen");

    const appScreen =
      document.getElementById("app");

    const loginEmail =
      document.getElementById("loginEmail");

    const loginPassword =
      document.getElementById("loginPassword");

    const loginButton =
      document.getElementById("loginButton");

    const loginError =
      document.getElementById("loginError");

    const logoutButton =
      document.getElementById("logoutButton");

    const reminderTitle =
      document.getElementById("reminderTitle");

    const reminderDate =
      document.getElementById("reminderDate");

    const reminderFor =
      document.getElementById("reminderFor");

    const addReminderButton =
      document.getElementById("addReminderButton");

    const remindersList =
      document.getElementById("remindersList");


    /* =========================
       CONNEXION
    ========================= */

    loginButton.addEventListener("click", async () => {

      const email =
        loginEmail.value.trim();

      const password =
        loginPassword.value;

      loginError.style.display = "none";

      if (!email || !password) {

        loginError.textContent =
          "Entre ton e-mail et ton mot de passe ❤️";

        loginError.style.display = "block";

        return;
      }


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      } catch (error) {

        console.error(
          "Erreur Firebase :",
          error
        );

        loginError.textContent =
          "Connexion impossible : " +
          error.code;

        loginError.style.display =
          "block";
      }

    });


    /* =========================
       DECONNEXION
    ========================= */

    logoutButton.addEventListener(
      "click",
      async () => {

        await signOut(auth);

      }
    );


    /* =========================
       UTILISATEUR CONNECTE
    ========================= */

    let unsubscribeReminders = null;


    onAuthStateChanged(
      auth,
      (user) => {

        if (!user) {

          loginScreen.style.display =
            "flex";

          appScreen.style.display =
            "none";

          if (unsubscribeReminders) {

            unsubscribeReminders();

            unsubscribeReminders =
              null;
          }

          return;
        }


        console.log(
          "Utilisateur connecté :",
          user.email,
          user.uid
        );


        loginScreen.style.display =
          "none";

        appScreen.style.display =
          "block";


        listenToReminders();

      }
    );


    /* =========================
       RAPPELS
    ========================= */

    function listenToReminders() {

      if (unsubscribeReminders) {

        unsubscribeReminders();

      }


      const remindersQuery =
        query(
          collection(db, "reminders"),
          orderBy("date", "asc")
        );


      unsubscribeReminders =
        onSnapshot(
          remindersQuery,

          (snapshot) => {

            remindersList.innerHTML = "";


            if (snapshot.empty) {

              remindersList.innerHTML =
                '<div class="empty">Aucun rappel pour le moment ❤️</div>';

              return;
            }


            snapshot.forEach(
              (reminderDoc) => {

                const reminder =
                  reminderDoc.data();

                displayReminder(
                  reminderDoc.id,
                  reminder
                );

              }
            );

          },

          (error) => {

            console.error(
              "Erreur Firestore :",
              error
            );

            remindersList.innerHTML =
              `<div class="empty">
                Erreur Firestore : ${error.code}
              </div>`;
          }
        );

    }


    /* =========================
       AFFICHAGE
    ========================= */

    function displayReminder(
      id,
      reminder
    ) {

      const element =
        document.createElement("div");

      element.className =
        "reminder";

      if (reminder.done) {

        element.classList.add("done");

      }


      const content =
        document.createElement("div");

      content.className =
        "reminderContent";


      const title =
        document.createElement("div");

      title.className =
        "reminderTitle";

      title.textContent =
        reminder.title;


      const info =
        document.createElement("div");

      info.className =
        "reminderInfo";


      let dateText = "";

      if (reminder.date) {

        const date =
          new Date(reminder.date);

        dateText =
          date.toLocaleString(
            "fr-CH",
            {
              dateStyle: "short",
              timeStyle: "short"
            }
          );
      }


      info.textContent =
        `Pour : ${reminder.targetName || "—"} • ${dateText}`;


      content.appendChild(title);

      content.appendChild(info);


      const checkbox =
        document.createElement("input");

      checkbox.type =
        "checkbox";

      checkbox.checked =
        reminder.done === true;


      checkbox.addEventListener(
        "change",
        async () => {

          await updateDoc(
            doc(
              db,
              "reminders",
              id
            ),
            {
              done:
                checkbox.checked
            }
          );

        }
      );


      const deleteButton =
        document.createElement("button");

      deleteButton.className =
        "deleteButton";

      deleteButton.textContent =
        "Supprimer";


      deleteButton.addEventListener(
        "click",
        async () => {

          await deleteDoc(
            doc(
              db,
              "reminders",
              id
            )
          );

        }
      );


      element.appendChild(
        checkbox
      );

      element.appendChild(
        content
      );

      element.appendChild(
        deleteButton
      );


      remindersList.appendChild(
        element
      );

    }


    /* =========================
       AJOUTER UN RAPPEL
    ========================= */

    addReminderButton.addEventListener(
      "click",
      async () => {

        const user =
          auth.currentUser;

        if (!user) return;


        const title =
          reminderTitle.value.trim();

        const date =
          reminderDate.value;

        const target =
          reminderFor.value;


        if (!title || !date) {

          alert(
            "Ajoute un texte et une date ❤️"
          );

          return;
        }


        const targetName =
          target === "me"
            ? user.email
            : "Partenaire";


        try {

          await addDoc(
            collection(
              db,
              "reminders"
            ),
            {

              title:
                title,

              date:
                date,

              target:
                target,

              targetName:
                targetName,

              createdBy:
                user.uid,

              createdByEmail:
                user.email,

              done:
                false,

              createdAt:
                serverTimestamp()

            }
          );


          reminderTitle.value =
            "";

          reminderDate.value =
            "";

        } catch (error) {

          console.error(
            "Erreur création rappel :",
            error
          );

          alert(
            "Erreur Firestore : " +
            error.code
          );

        }

      }
    );

  </script>

</body>
</html>
