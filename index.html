<!DOCTYPE html>

<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#314f3d">

  <title>Mes rappels ❤️</title>

 

  <style>

    * {

      box-sizing: border-box;

    }

 

    body {

      margin: 0;

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      background: #f4f1eb;

      color: #26352d;

    }

 

    .app {

      max-width: 600px;

      margin: auto;

      padding: 25px 18px 40px;

    }

 

    header {

      text-align: center;

      margin-bottom: 25px;

    }

 

    h1 {

      margin-bottom: 5px;

      font-size: 30px;

    }

 

    .subtitle {

      color: #68756d;

    }

 

    .add-box {

      background: white;

      padding: 18px;

      border-radius: 20px;

      box-shadow: 0 4px 15px rgba(0,0,0,0.08);

      margin-bottom: 20px;

    }

 

    input, button {

      font: inherit;

    }

 

    input {

      width: 100%;

      padding: 13px;

      border: 1px solid #ddd;

      border-radius: 12px;

      margin-bottom: 10px;

      background: #fafafa;

    }

 

    .row {

      display: flex;

      gap: 10px;

    }

 

    .row input {

      flex: 1;

    }

 

    button {

      border: none;

      border-radius: 12px;

      padding: 12px 16px;

      cursor: pointer;

    }

 

    .add {

      width: 100%;

      background: #314f3d;

      color: white;

      font-weight: bold;

    }

 

    .reminder {

      background: white;

      border-radius: 18px;

      padding: 15px;

      margin-bottom: 12px;

      display: flex;

      align-items: center;

      gap: 12px;

      box-shadow: 0 3px 12px rgba(0,0,0,0.06);

    }

 

    .reminder.done {

      opacity: 0.55;

    }

 

    .reminder.done .title {

      text-decoration: line-through;

    }

 

    .check {

      width: 25px;

      height: 25px;

      border-radius: 50%;

      border: 2px solid #557761;

      padding: 0;

      flex-shrink: 0;

      background: white;

    }

 

    .check.checked {

      background: #557761;

      color: white;

    }

 

    .info {

      flex: 1;

    }

 

    .title {

      font-weight: 600;

      margin-bottom: 4px;

    }

 

    .date {

      font-size: 13px;

      color: #7b857e;

    }

 

    .delete {

      background: #f4e5e3;

      color: #9a4c43;

      padding: 8px 10px;

    }

 

    .empty {

      text-align: center;

      color: #89938d;

      margin-top: 35px;

    }

  </style>

</head>

 

<body>

 

<div class="app">

 

  <header>

    <h1>Mes rappels ❤️</h1>

    <div class="subtitle">N'oublie rien, même les petites choses.</div>

  </header>

 

  <div class="add-box">

 

    <input

      type="text"

      id="title"

      placeholder="Que dois-tu faire ?"

    >

 

    <div class="row">

      <input type="date" id="date">

      <input type="time" id="time">

    </div>

 

    <button class="add" onclick="addReminder()">

      + Ajouter un rappel

    </button>

 

  </div>

 

  <div id="reminders"></div>

 

</div>

 

<script>

 

let reminders = JSON.parse(localStorage.getItem("reminders")) || [];

 

function save() {

  localStorage.setItem("reminders", JSON.stringify(reminders));

}

 

function addReminder() {

 

  const title = document.getElementById("title").value.trim();

  const date = document.getElementById("date").value;

  const time = document.getElementById("time").value;

 

  if (!title) {

    alert("Écris d'abord ce que tu dois faire ❤️");

    return;

  }

 

  reminders.push({

    id: Date.now(),

    title: title,

    date: date,

    time: time,

    done: false

  });

 

  save();

 

  document.getElementById("title").value = "";

  document.getElementById("date").value = "";

  document.getElementById("time").value = "";

 

  displayReminders();

}

 

function toggleReminder(id) {

 

  const reminder = reminders.find(r => r.id === id);

 

  if (reminder) {

    reminder.done = !reminder.done;

  }

 

  save();

  displayReminders();

}

 

function deleteReminder(id) {

 

  reminders = reminders.filter(r => r.id !== id);

 

  save();

  displayReminders();

}

 

function displayReminders() {

 

  const container = document.getElementById("reminders");

 

  container.innerHTML = "";

 

  if (reminders.length === 0) {

    container.innerHTML =

      '<div class="empty">Aucun rappel pour le moment 🌿</div>';

    return;

  }

 

  reminders.sort((a, b) => {

 

    const dateA = (a.date || "") + (a.time || "");

    const dateB = (b.date || "") + (b.time || "");

 

    return dateA.localeCompare(dateB);

  });

 

  reminders.forEach(reminder => {

 

    const element = document.createElement("div");

 

    element.className =

      "reminder " + (reminder.done ? "done" : "");

 

    let details = "";

 

    if (reminder.date) {

      details += new Date(reminder.date + "T00:00:00")

        .toLocaleDateString("fr-FR");

 

      if (reminder.time) {

        details += " à " + reminder.time;

      }

    } else if (reminder.time) {

      details = "À " + reminder.time;

    }

 

    element.innerHTML = `

 

      <button

        class="check ${reminder.done ? "checked" : ""}"

        onclick="toggleReminder(${reminder.id})">

        ${reminder.done ? "✓" : ""}

      </button>

 

      <div class="info">

        <div class="title">${escapeHtml(reminder.title)}</div>

        <div class="date">${details}</div>

      </div>

 

      <button

        class="delete"

        onclick="deleteReminder(${reminder.id})">

        🗑️

      </button>

 

    `;

 

    container.appendChild(element);

  });

}

 

function escapeHtml(text) {

 

  const div = document.createElement("div");

 

  div.textContent = text;

 

  return div.innerHTML;

}

 

displayReminders();

 

</script>

 
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js")
        .then(() => {
          console.log("Service worker activé");
        })
        .catch(error => {
          console.error("Erreur service worker :", error);
        });
    });
  }
</script>

</body>

</html>
